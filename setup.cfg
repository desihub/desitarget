[metadata]
name = desitarget
version = attr: desitarget.__version__
author = DESI Collaboration
author_email = desi-data@desi.lbl.gov
license = BSD-3-Clause
license_files = LICENSE.rst
url = https://github.com/desihub/desitarget
description = DESI targeting
long_description = file: README.rst
long_description_content_type = text/x-rst
edit_on_github = True
github_project = desihub/destarget
classifiers =
    Development Status :: 5 - Production/Stable
    Environment :: Console
    Intended Audience :: Science/Research
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Topic :: Scientific/Engineering :: Astronomy

[options]
zip_safe = True
package_dir =
    =py
# find_namespace avoids a warning about data directories when building packages.
packages = find_namespace:
include_package_data = True
python_requires = >=3.10
# setup_requires = setuptools_scm
# pytz is only required if Python < 3.11.
install_requires =
    pytz
    astropy
    scipy
    matplotlib
    healpy
    fitsio
    numba
    desiutil
    desimodel
#    git+https://github.com/desihub/specter.git@0.10.1#egg=specter
# scripts =
#     bin/add_archive_to_mtl


# [options.entry_points]
# console_scripts =
#     console_script = desitarget.console:main

[options.extras_require]
# photutils had been pinned to 1.6.0, but that doesn't appear to work with NumPy > 2.0.
all =
    photutils
    joblib
    sklearn
test =
    pytest
coverage =
    pytest-cov
    coveralls
doc =
    Sphinx
    sphinx-rtd-theme

# [options.package_data]
# desitarget = data/*
# desitarget.test = t/*

[options.packages.find]
where = py
exclude = .github/*

[coverage:run]
relative_files = True
source =
    py/desitarget
omit =
    py/desitarget/_version.py
    py/desitarget/conftest*
    py/desitarget/mock/build.py
    py/desitarget/skyutilities/*
    py/desitarget/test/*
    py/desitarget/train/*
    */desitarget/_version.py
    */desitarget/conftest*
    */desitarget/mock/build.py
    */desitarget/skyutilities/*
    */desitarget/test/*
    */desitarget/train/*

# [coverage:paths]
# source =
#     py/desitarget/
#     */site-packages/desitarget/

[coverage:report]
exclude_lines =
    # Have to re-enable the standard pragma
    pragma: no cover
    # Don't complain about packages we have installed
    except ImportError
    # Don't complain if tests don't hit assertions
    raise AssertionError
    raise NotImplementedError
    # Don't complain about script hooks
    def main\(.*\):
    # Ignore branches that don't pertain to this version of Python
    pragma: py{ignore_python_version}
    # Don't complain about IPython completion helper
    def _ipython_key_completions_

[pycodestyle]
# See https://pycodestyle.readthedocs.io/en/latest/intro.html#configuration
# for details of these configuration options.
#
# These are normally ignored by default:
# ignore = E121, E123, E126, E133, E226, E241, E242, E704, W503, W504
#
# Instead of the default set we (currently) use:
# - E201 whitespace after '('
# - E202 whitespace before ')'
# - E226 missing whitespace around arithmetic operator
# - E261 at least two spaces before inline comment
# - E265 block comment should start with '# '
# - E275 missing whitespace after keyword
# - E501 line too long (82 > 79 characters)
# - E731 do not assign a lambda expression, use a def
# - E741 do not use variables named 'l', 'O', or 'I' -- because, for example, 'l' might refer to Galactic longitude.
# - W293 blank line contains whitespace
# - W503 line break before binary operator
# - W504 line break after binary operator
ignore = E201,E202,E226,E261,E265,E275,E501,W293,W503,W504
# ignore = E121,E123,E126,E133,E201,E202,E226,E241,E242,E275,E501,E704,E731,E741,W503,W504
# These file patterns are normally ignored by default:
# exclude = .svn, CVS, .bzr, .hg, .git
#
# In addition to the defaults we add the sandbox directory and external packages
exclude = .svn, CVS, .bzr, .hg, .git, sandbox, internal, skyutilities
